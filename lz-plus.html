<!doctype html>
<html lang="es">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<meta name="apple-mobile-web-app-title" content="LZ-SHARE">
<meta name="theme-color" content="#07060E">
<link rel="manifest" href="manifest.webmanifest">
<link rel="apple-touch-icon" href="apple-touch-icon.png">
<title>LZ-SHARE</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Manrope:wght@400;500;600;700;800&family=Big+Shoulders+Display:wght@700;800;900&display=swap" rel="stylesheet">
<script src="https://cdn.jsdelivr.net/npm/hls.js@1"></script>
<style>
  :root{--bg:#07060E;--rail:#0C0A17;--card:#141126;--card2:#1C1833;--line:#272144;--tx:#F5F3FB;--mut:#A7A0C0;--accent:#A33BFF;--accent2:#D61FF0;--grad:linear-gradient(135deg,#8A2BF2 0%,#B32CF5 55%,#D61FF0 100%);--glow:rgba(163,59,255,.45);--ok:#6EE7A0;--bad:#FF8A7A}
  *{box-sizing:border-box}
  [hidden]{display:none!important}
  html{font-size:calc(.95vw * var(--ui,1))}
  html{font-size:calc(max(8px, min(.95vw, 1.69vh)) * var(--ui,1))}
  body{padding:var(--safe,0)}
  #app{height:calc(100vh - 2 * var(--safe,0px)) !important}
  body{margin:0;background:var(--bg);color:var(--tx);font-family:Manrope,system-ui,sans-serif;overflow:hidden}
  a{color:#C88BFF}
  .disp{font-family:'Big Shoulders Display',sans-serif;font-weight:800;letter-spacing:.01em}
  #app{display:flex;height:100vh;overflow:hidden}

  /* ---------- Menú lateral ---------- */
  #rail{width:16rem;flex-shrink:0;background:linear-gradient(180deg,#0B1122,#070A12);border-right:1px solid var(--line);display:flex;flex-direction:column;padding:1.8rem .9rem;gap:.35rem;transition:width .18s ease;z-index:5;overflow:hidden}

  .brand{display:flex;align-items:center;gap:.9rem;height:3.4rem;padding-left:.35rem;margin-bottom:1.6rem;white-space:nowrap;font-size:1.9rem}
  .logo{width:3.2rem;height:3.2rem;flex-shrink:0;border-radius:.9rem;background:var(--grad);color:#0A0E18;display:grid;place-items:center;font-size:1.5rem}
  .brand b{color:var(--accent2)}
  .nav{all:unset;cursor:pointer;display:flex;align-items:center;gap:1.1rem;height:3.4rem;padding:0 1.05rem;border-radius:.9rem;color:var(--mut);font-weight:700;font-size:1.15rem;white-space:nowrap}
  .nav svg{width:1.7rem;height:1.7rem;flex-shrink:0}
  .nav{text-transform:uppercase;letter-spacing:.04em;font-size:1.05rem}
  .nav.on{color:#fff;background:var(--grad)}.nav.on svg{color:#fff}
  .nav:focus{background:var(--grad);color:#fff}.nav:focus svg{color:#fff}
  .rail-sp{flex:1}
  /* Menú angosto (solo iconos) mientras navegas el contenido; se abre encima del contenido al volver a él */
  body:not(.phone) #app{position:relative}
  body:not(.phone) #rail{position:absolute;top:0;left:0;bottom:0;z-index:30;box-shadow:1.2rem 0 3rem rgba(0,0,0,.65)}
  body:not(.phone) main{margin-left:5.8rem}
  body.mini:not(.phone) #rail{width:5.8rem;padding:1.8rem .75rem;box-shadow:none}
  body.mini:not(.phone) .nav{justify-content:center;padding:0;gap:0}
  body.mini:not(.phone) .nav span{display:none}
  body.mini:not(.phone) .blogo{max-width:4.3rem;min-height:2.8rem}

  main{flex:1;min-width:0;overflow-y:auto;overflow-x:hidden;position:relative}
  main::-webkit-scrollbar{width:0}
  .view{display:none;padding-bottom:4rem}.view.on{display:block}
  .topbar{position:fixed;top:1rem;right:1.6rem;z-index:6;display:flex;align-items:center;gap:.4rem}
  .tbtn{all:unset;cursor:pointer;width:2.8rem;height:2.8rem;border-radius:50%;display:grid;place-items:center;color:#DCE2EC}
  .tbtn svg,.tnet svg{width:1.45rem;height:1.45rem}
  .tbtn:focus,body:not(.kbd) .tbtn:hover{background:var(--grad);color:#fff}
  .tbtn.tprof{width:auto;padding:0 .8rem;gap:.45rem;display:inline-flex;border-radius:1.4rem;font-weight:700}
  .tbtn.tprof span:empty{display:none}
  body.kidsmode #rail .nav:not([data-view=vivo]):not([data-view=kids]){display:none}
  body.kidsmode #tbCode,body.kidsmode [data-go=buscar],body.kidsmode #srcs{display:none}
  .profs{display:flex;gap:1.4rem;flex-wrap:wrap;justify-content:center;margin:1rem 0}
  .prof{all:unset;cursor:pointer;display:flex;flex-direction:column;align-items:center;gap:.6rem;padding:1rem;border-radius:1rem;min-width:9rem}
  .prof i{width:6.5rem;height:6.5rem;border-radius:1.2rem;display:grid;place-items:center;font-style:normal;font-size:2.6rem;font-weight:900;color:#111}
  .prof b{font-size:1.2rem}
  .prof:focus,body:not(.kbd) .prof:hover{background:rgba(255,255,255,.1)}
  .prof:focus i{box-shadow:0 0 0 .3rem #fff}
  #saver{position:fixed;top:0;right:0;bottom:0;left:0;z-index:90;background:#000;overflow:hidden;cursor:none}
  #saver .sv{position:absolute;top:-4%;right:-4%;bottom:-4%;left:-4%;background-size:cover;background-position:center;opacity:0;transition:opacity 2s;animation:kb 20s linear infinite alternate}
  #saver .sv.on{opacity:.75}
  body.lite #saver .sv{animation:none;top:0;right:0;bottom:0;left:0}
  @keyframes kb{from{transform:scale(1)}to{transform:scale(1.08) translate(-1%,1%)}}
  #saver .svc{position:absolute;right:4rem;bottom:3.4rem;text-align:right;text-shadow:0 2px 14px #000}
  #saver .svc b{display:block;font-size:6rem;line-height:1}
  #saver .svc span{font-size:1.6rem;opacity:.85}
  .tbtn.tcode{width:auto;padding:0 1rem;border-radius:1.4rem;gap:.5rem;display:inline-flex;font-weight:800;background:rgba(163,59,255,.18);color:#D9B8FF}
  .tnet{width:2.4rem;display:grid;place-items:center;color:#DCE2EC}.tnet.off{color:var(--bad)}
  .clock{font-weight:800;font-size:1.35rem;padding:0 .4rem;text-shadow:0 2px 10px #000}
  .head{padding:2.6rem 3rem 1.2rem;display:flex;align-items:flex-end;gap:1.6rem;flex-wrap:wrap}
  .head h1{margin:0;font-size:3.6rem;line-height:1}
  .head p{margin:0;color:var(--mut);font-size:1.05rem}
  .note{color:var(--mut);font-size:1rem;line-height:1.5;margin:0}

  /* ---------- Portada (se actualiza con lo que tengas seleccionado) ---------- */
  .spot{position:relative;height:64vh;min-height:24rem;display:flex;align-items:flex-end;overflow:hidden}
  .spot .bg{position:absolute;top:0;right:0;bottom:0;left:0;background:#0B0F1A center 20%/cover no-repeat;transition:opacity .4s}
  .spot .bg.fade{opacity:0}
  .spot::after{content:'';position:absolute;top:0;right:0;bottom:0;left:0;background:linear-gradient(90deg,var(--bg) 0%,rgba(6,8,15,.88) 28%,rgba(6,8,15,.25) 62%,rgba(6,8,15,.05)),linear-gradient(0deg,var(--bg) 1%,transparent 42%);pointer-events:none}
  .spot .in{position:relative;z-index:1;padding:0 3rem 7.5rem;max-width:46rem;display:flex;flex-direction:column;gap:.9rem}
  .kick{color:#C88BFF;font-weight:800;font-size:1rem;letter-spacing:.08em;text-transform:uppercase;display:flex;gap:.8rem;flex-wrap:wrap}
  .spot h1{margin:0;font-size:4.4rem;line-height:.92}
  .spot p{margin:0;color:#D5DBE7;font-size:1.2rem;line-height:1.5;display:-webkit-box;-webkit-line-clamp:3;-webkit-box-orient:vertical;overflow:hidden}
  .btns{display:flex;gap:.9rem;flex-wrap:wrap;margin-top:.4rem}
  .rows{position:relative;z-index:1;margin-top:-5.5rem;display:flex;flex-direction:column;gap:1.8rem}
  .rows.flat{margin-top:0}
  /* Portada fija arriba y filas que se desplazan debajo (estilo TV) */
  .view.cat.on{display:flex;flex-direction:column;height:100vh;padding-bottom:0}
  .view.cat .spot{height:56vh;min-height:20rem;flex-shrink:0}
  .view.cat .rows{flex:1;min-height:0;overflow-y:auto;margin-top:-6.5rem;padding-bottom:4rem;scroll-padding-top:1rem}
  .view.cat .rows::-webkit-scrollbar{width:0}
  .row{content-visibility:auto;contain-intrinsic-size:auto 26rem}
  body.lite .card:focus .pi,body.phone .card:focus .pi{box-shadow:0 0 0 .22rem var(--accent2)}
  body.lite .btn:focus,body.lite .nav:focus,body.lite .chip:focus,body.lite .key:focus,body.lite .gbtn:focus,body.lite .opt:focus,body.lite .ibtn:focus{box-shadow:none}
  .row h3{margin:0 0 .2rem 3rem;font-size:1.7rem;display:flex;gap:1rem;align-items:baseline}
  .row h3 small{font-family:Manrope,sans-serif;font-size:.95rem;color:var(--mut);font-weight:600;letter-spacing:0}
  .strip{display:flex;gap:1.1rem;overflow-x:auto;padding:1rem 3rem 1.3rem;scroll-padding:0 3rem}
  .strip::-webkit-scrollbar{display:none}
  .row .empty{margin:0 3rem;color:var(--mut)}

  /* ---------- Tarjetas ---------- */
  .card{all:unset;cursor:pointer;flex-shrink:0;width:11.5rem;display:flex;flex-direction:column;gap:.6rem;outline:none}
  .card .pi{width:100%;aspect-ratio:2/3;border-radius:.8rem;overflow:hidden;background:var(--card);position:relative;transition:transform .18s ease,box-shadow .18s ease}
  .card img{width:100%;height:100%;object-fit:cover;display:block}
  .card.top{width:15.2rem;display:grid;grid-template-columns:4.2rem 1fr;row-gap:.6rem}
  .card.top .tnum{grid-column:1;grid-row:1;align-self:end;justify-self:end;margin-right:-1.3rem;font-size:8rem;font-weight:900;line-height:.74;letter-spacing:-.06em;color:#0b0914;-webkit-text-stroke:.2rem rgba(255,255,255,.8);text-shadow:0 .3rem 1.2rem rgba(0,0,0,.6);z-index:0;font-family:Manrope,system-ui,sans-serif}
  .card.top .tnum.two{font-size:6.2rem;letter-spacing:-.12em}
  .card.top .pi{grid-column:2;grid-row:1;z-index:1}
  .card.top .ct,.card.top .sub{grid-column:2}
  .card .ct{font-size:1rem;font-weight:700;color:var(--mut);white-space:nowrap;overflow:hidden;text-overflow:ellipsis;padding:0 .1rem}
  .card .sub{font-size:.85rem;color:#6D7894;margin-top:-.4rem;padding:0 .1rem}
  .card:focus .pi,body:not(.kbd) .card:hover .pi{transform:scale(1.08);box-shadow:0 0 0 .22rem var(--accent2),0 0 1.6rem var(--glow),0 1rem 2.4rem rgba(0,0,0,.65)}
  .card:focus .ct{color:#fff}
  .card .prog{position:absolute;left:0;right:0;bottom:0;height:.35rem;background:rgba(255,255,255,.18)}
  .card .prog i{display:block;height:100%;background:var(--grad)}
  .card .seen{position:absolute;top:.5rem;right:.5rem;width:1.8rem;height:1.8rem;border-radius:50%;background:var(--grad);color:#fff;font-weight:800;display:flex;align-items:center;justify-content:center;font-size:1rem;box-shadow:0 2px 8px rgba(0,0,0,.5)}
  .card .here{position:absolute;top:.5rem;left:.5rem;background:rgba(0,0,0,.75);color:#fff;font-weight:700;font-size:.8rem;padding:.2rem .6rem;border-radius:1rem;border:1px solid var(--accent)}
  .card .tags{position:absolute;top:.5rem;left:.5rem;display:flex;flex-direction:column;align-items:flex-start;gap:.3rem;z-index:1}
  .card .tags span{background:var(--grad);color:#fff;font-weight:800;font-size:.7rem;letter-spacing:.04em;padding:.15rem .45rem;border-radius:.4rem;box-shadow:0 2px 6px rgba(0,0,0,.45)}
  .card .tags .lat{background:#14915a}
  .card .tags .nep{background:#e8a317;color:#1a1200}
  .spot-logo{display:block;max-width:26rem;max-height:7.5rem;width:auto;height:auto;object-fit:contain;object-position:left bottom;filter:drop-shadow(0 .3rem 1rem rgba(0,0,0,.6))}
  .spot .kick .lat{color:#3ee08f}
  /* Pantallas bajas (proyectores de 480-600 px de alto): portada más baja para que el logo y la primera fila quepan juntos */
  @media (max-height:620px){body:not(.phone) .spot{height:58vh;min-height:0}body:not(.phone) .spot .in{padding-bottom:3rem;gap:.55rem}body:not(.phone) .rows{margin-top:-1.6rem}body:not(.phone) .view.cat .rows{margin-top:-1.6rem}body:not(.phone) .spot-logo{max-height:4.6rem;max-width:20rem}body:not(.phone) .spot p{-webkit-line-clamp:2;font-size:1.05rem}body:not(.phone) .spot h1{font-size:3rem}}
  body.phone .spot-logo{max-width:14rem;max-height:4.5rem}
  .people{gap:1.4rem}
  .person{flex:none;width:7.6rem;display:flex;flex-direction:column;align-items:center;gap:.55rem;text-align:center}
  .pph{position:relative;width:6.6rem;height:6.6rem;border-radius:50%;overflow:hidden;background:linear-gradient(135deg,#2a1d4f,#3b1d5c);display:grid;place-items:center;box-shadow:0 .3rem 1rem rgba(0,0,0,.45);border:2px solid rgba(255,255,255,.08)}
  .pph span{font-weight:800;font-size:1.6rem;color:#cbbcff;letter-spacing:.04em}
  .pph img{position:absolute;top:0;left:0;width:100%;height:100%;object-fit:cover;object-position:center 20%}
  .pn{font-size:.9rem;font-weight:700;color:#DDE3EE;line-height:1.25;display:-webkit-box;-webkit-line-clamp:2;-webkit-box-orient:vertical;overflow:hidden}
  body.phone .person{width:5.6rem}body.phone .pph{width:4.8rem;height:4.8rem}body.phone .pph span{font-size:1.2rem}
  .card .ok-b{position:absolute;left:.5rem;bottom:.5rem;background:rgba(10,40,24,.88);color:var(--ok);font-weight:800;font-size:.75rem;padding:.2rem .5rem;border-radius:.4rem}
  .card .badge-r{position:absolute;top:.5rem;right:.5rem;background:rgba(0,0,0,.75);color:var(--accent);font-weight:800;font-size:.8rem;padding:.2rem .5rem;border-radius:.4rem}
  .card.wide{width:17rem}.card.wide .pi{aspect-ratio:16/9}
  .card.ch{width:14rem}.card.ch .pi{aspect-ratio:16/9;background:linear-gradient(160deg,#182036,#0D1220);display:grid;place-items:center}
  .card.ch .pi img{width:70%;height:70%;object-fit:contain}
  .card.ch .live{position:absolute;top:.5rem;left:.5rem;background:#E5484D;color:#fff;font-weight:800;font-size:.7rem;padding:.15rem .45rem;border-radius:.3rem;letter-spacing:.05em}
  .ph{position:absolute;top:0;right:0;bottom:0;left:0;display:grid;place-items:center;padding:1rem;text-align:center;font-weight:800;font-size:1.1rem;color:var(--mut);background:linear-gradient(160deg,#1A2236,#0E1322)}
  .sk .pi{animation:pulse 1.2s ease-in-out infinite}
  @keyframes pulse{50%{opacity:.45}}
  .grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(11.5rem,1fr));gap:1.6rem 1.1rem;padding:1rem 3rem}
  .grid .card{width:auto}

  /* ---------- Botones y campos ---------- */
  .btn{all:unset;cursor:pointer;display:inline-flex;align-items:center;justify-content:center;gap:.6rem;height:3.3rem;padding:0 1.7rem;border-radius:.8rem;font-weight:800;font-size:1.15rem;background:rgba(255,255,255,.13);color:#fff;transition:transform .12s ease;white-space:nowrap}
  .btn svg{width:1.3rem;height:1.3rem}
  .btn.pri{background:#fff;color:#14072A}
  .btn:focus,.nav:focus,.chip:focus,.key:focus,.gbtn:focus,.opt:focus,.ibtn:focus{box-shadow:0 0 1.2rem var(--glow)}
  .btn.sm{height:2.7rem;padding:0 1.1rem;font-size:1rem}
  .btn.danger{color:var(--bad)}
  .btn:focus,body:not(.kbd) .btn:hover{background:var(--grad);color:#fff;transform:scale(1.05)}
  .chips{display:flex;gap:.6rem;flex-wrap:wrap}
  .chip{all:unset;cursor:pointer;height:2.7rem;padding:0 1.2rem;border-radius:1.35rem;background:var(--card);border:1px solid var(--line);color:var(--mut);font-weight:700;font-size:1.02rem;display:inline-flex;align-items:center;gap:.5rem;white-space:nowrap}
  .chip.on{background:#fff;color:#111;border-color:#fff}
  .chip:focus,body:not(.kbd) .chip:hover{background:var(--grad);color:#fff;border-color:var(--accent);transform:scale(1.05)}
  input{height:3.3rem;width:100%;min-width:0;font:inherit;font-size:1.15rem;border-radius:.8rem;border:2px solid var(--line);background:var(--card);color:var(--tx);padding:0 1.1rem}
  input:focus{border-color:var(--accent);outline:0}
  label.f{display:flex;flex-direction:column;gap:.45rem;font-size:.85rem;color:var(--mut);font-weight:800;letter-spacing:.06em;text-transform:uppercase}

  /* ---------- TV (estilo televisión: video al centro, canales a la derecha) ---------- */
  #v-vivo{padding-bottom:0}
  .tvl{display:grid;grid-template-columns:minmax(0,1fr) 25rem;gap:1.4rem;padding:4.6rem 1.8rem 1.4rem 1.6rem;height:calc(100vh - 2 * var(--safe,0px))}
  .tvmain{display:flex;flex-direction:column;gap:1rem;min-width:0;min-height:0}
  .tvmain .slot{flex:1;min-height:0;aspect-ratio:auto;border-radius:1rem;outline:none}
  .tvmain .slot:focus{box-shadow:0 0 0 .25rem var(--accent)}
  /* En la tele (WebView de Android) un video dentro de un cuadro redondeado que recorta sale negro: sin recorte */
  body.lite .slot,body.lite .tvmain .slot{border-radius:0;overflow:visible}
  .tvname{position:absolute;left:1.4rem;bottom:1.1rem;font-weight:800;font-size:1.4rem;text-shadow:0 2px 8px #000;pointer-events:none;max-width:70%;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
  .tvfull{position:absolute;right:1.2rem;bottom:1rem;color:#fff;opacity:.85;pointer-events:none}
  .tvfull svg{width:1.8rem;height:1.8rem}
  .mutehint{position:absolute;top:1rem;left:1rem;background:rgba(0,0,0,.7);padding:.5rem .9rem;border-radius:.6rem;font-weight:700;pointer-events:none}
  #pv.full~.tvname,#pv.full~.tvepg{display:none}
  .tvepg{position:absolute;left:1.4rem;bottom:1.1rem;font-weight:600;font-size:1.05rem;color:#E8ECF4;text-shadow:0 2px 8px #000;pointer-events:none;max-width:80%;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
  .tvepg:empty{display:none}
  .tvbar{display:flex;align-items:center;gap:.8rem;flex-shrink:0;padding-left:.4rem}
  .ibtn{all:unset;cursor:pointer;height:3.2rem;padding:0 1rem;border-radius:.8rem;display:inline-flex;align-items:center;gap:.6rem;color:#DCE2EC;font-weight:700}
  .ibtn svg{width:1.6rem;height:1.6rem}
  .ibtn:focus,body:not(.kbd) .ibtn:hover{background:var(--grad);color:#fff}
  .tvinfo{margin-left:auto;color:var(--mut);font-weight:600;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
  .tvside{display:flex;flex-direction:column;min-height:0;background:rgba(255,255,255,.03);border-radius:1rem;padding:.4rem}
  .tvside .arrow{text-align:center;color:#DCE2EC;font-size:.9rem;padding:.3rem;flex-shrink:0}
  .tvside .col{flex:1}
  .tvside .chrow{min-height:4.4rem;gap:.9rem}
  .tvside .chrow .no{display:none}
  .tvside .lg{width:3.8rem;height:3.8rem;border-radius:.6rem;background:#1A2238}
  .tvside .chrow small{display:none}
  .tvside .chrow b{font-size:1.15rem}

  /* ---------- En vivo ---------- */
  .srcs{display:flex;gap:.6rem;overflow-x:auto;padding:.3rem 0}
  .srcs::-webkit-scrollbar{display:none}
  .live{display:grid;grid-template-columns:15rem minmax(0,1fr) minmax(0,1.3fr);gap:1.4rem;padding:0 3rem;height:calc(100vh - 10.5rem)}
  .col{min-height:0;display:flex;flex-direction:column;gap:.35rem;overflow-y:auto;padding:.2rem}
  .col::-webkit-scrollbar{width:0}
  .gbtn{all:unset;cursor:pointer;padding:.85rem 1rem;border-radius:.7rem;font-weight:700;font-size:1.05rem;color:var(--mut);display:flex;justify-content:space-between;gap:.5rem;flex-shrink:0}
  .gbtn small{opacity:.7}
  .gbtn.on{color:#fff;background:var(--card)}
  .gbtn:focus,body:not(.kbd) .gbtn:hover{background:var(--grad);color:#fff}
  .chrow{all:unset;cursor:pointer;display:flex;align-items:center;gap:1rem;padding:.55rem .9rem;border-radius:.8rem;min-height:3.6rem;flex-shrink:0}
  .chrow .no{width:2.4rem;text-align:right;color:var(--mut);font-weight:800;flex-shrink:0}
  .lg{width:4.8rem;height:2.7rem;border-radius:.45rem;background:#0E1424;display:grid;place-items:center;overflow:hidden;flex-shrink:0;font-size:.8rem;font-weight:800;color:var(--mut)}
  .lg img{max-width:88%;max-height:88%;object-fit:contain}
  .chrow .tx{min-width:0;flex:1}
  .chrow b{display:block;font-size:1.12rem;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
  .chrow small{color:var(--mut);font-size:.9rem;white-space:nowrap;overflow:hidden;text-overflow:ellipsis;display:block}
  .chrow .st{color:var(--accent);font-size:1.1rem}
  .chrow.dead{opacity:.42}
  .chrow .sig{width:.65rem;height:.65rem;border-radius:50%;flex-shrink:0;background:var(--ok)}
  .chrow .sig.bad{background:#5A6378}
  .chrow.on{background:var(--card2);box-shadow:inset 0 0 0 2px rgba(163,59,255,.7)}
  .chrow:focus,body:not(.kbd) .chrow:hover{background:#fff;color:#111}
  .chrow:focus small,.chrow:focus .no,body:not(.kbd) .chrow:hover small,body:not(.kbd) .chrow:hover .no{color:#444}
  .prev{gap:1.1rem;overflow:visible}
  .slot{position:relative;aspect-ratio:16/9;border-radius:1rem;overflow:hidden;background:#000;flex-shrink:0}
  .pinfo{display:flex;flex-direction:column;gap:.6rem}
  .pinfo h2{margin:0;font-size:2.4rem;line-height:1}
  .pinfo .note b{color:var(--tx)}
  .more{all:unset;cursor:pointer;text-align:center;padding:.9rem;color:var(--accent);font-weight:800;border-radius:.7rem;flex-shrink:0}
  .more:focus{background:var(--grad);color:#fff}

  /* ---------- Reproductor ---------- */
  #pv{position:absolute;top:0;right:0;bottom:0;left:0;background:#000;outline:none}
  #pv.full{position:fixed;top:0;right:0;bottom:0;left:0;z-index:50}
  #pv video{width:100%;height:100%;display:block;background:#000}
  #pv video::cue{font-family:Manrope,system-ui,sans-serif;font-size:var(--cue,2.2rem);font-weight:600;color:#fff;background:rgba(0,0,0,.62);line-height:1.35}
  .msec{display:flex;flex-direction:column;gap:.7rem}
  .msec h3{margin:0;font-size:1.5rem;color:var(--mut)}
  .opt.cur{outline:2px solid var(--accent)}
  #yt,#yt iframe{position:absolute;top:0;right:0;bottom:0;left:0;width:100%;height:100%;border:0}
  #yt:empty{display:none}
  /* TV en vivo apagada (Ajustes): se quita del menú y los botones de canales */
  body.notv .nav[data-view="vivo"],body.notv #tbFav{display:none!important}
  /* Tele: el reproductor de la app va detrás de la página; la vista previa queda transparente para que se vea */
  body.inl{background:transparent}
  body.inl .slot,body.inl #pv{background:transparent}
  body.inl #pv video{visibility:hidden}
  #ffbar{position:absolute;left:0;right:0;bottom:0;display:flex;align-items:center;gap:.8rem;padding:1.4rem 1.4rem 1rem;background:linear-gradient(transparent,rgba(0,0,0,.85));z-index:6;opacity:0;transition:opacity .3s;pointer-events:none}
  #ffbar.on{opacity:1;pointer-events:auto}
  #ffbar[hidden]{display:none}
  #ffbar input{flex:1;accent-color:var(--accent);height:1.2rem;cursor:pointer}
  #ffbar button{background:none;border:0;color:#fff;font-size:1.5rem;cursor:pointer;width:2.4rem}
  #ffbar span{font-variant-numeric:tabular-nums;color:#DDE3EE;font-weight:700;min-width:4.6em;text-align:center}
  .gsetup{max-width:44rem;text-align:center}.gsetup .note{margin:.5rem 0}.gsetup input{width:100%;margin:.6rem 0;font-size:1.2rem}.gsetup .btns{justify-content:center;margin-top:.8rem}.gsetup .gurl{color:var(--accent);margin:.3rem 0}.gsetup .gcode{letter-spacing:.3em}
  .pv-msg{position:absolute;top:0;right:0;bottom:0;left:0;display:grid;place-items:center;text-align:center;padding:2rem;color:#D3DAE7;font-size:1.25rem;background:rgba(0,0,0,.5)}
  .pv-msg .btns{justify-content:center}
  .spin{width:3rem;height:3rem;border-radius:50%;border:.3rem solid rgba(255,255,255,.2);border-top-color:var(--accent);animation:sp 1s linear infinite;margin:0 auto 1rem}
  @keyframes sp{to{transform:rotate(360deg)}}
  .osd{position:absolute;left:0;right:0;bottom:0;padding:2.4rem 3.4rem;background:linear-gradient(transparent,rgba(0,0,0,.92));display:flex;gap:1.6rem;align-items:center;opacity:0;transition:opacity .3s;pointer-events:none}
  .osd.show{opacity:1}
  .skipi{position:absolute;right:3rem;bottom:6rem;border:0;border-radius:3rem;padding:.9rem 1.6rem;font-weight:800;font-size:1.3rem;background:var(--grad);color:#fff;cursor:pointer}
  #pv:not(.full) .skipi{display:none}
  .osd .oepg{margin:.4rem 0 0;color:#fff;font-weight:700;font-size:1.25rem}
  .epg{display:flex;flex-direction:column;gap:.35rem;margin:.2rem 0 1rem;padding:.9rem 1rem;border-radius:.8rem;background:rgba(255,255,255,.05)}
  .epg b{font-size:1.25rem}
  .epg small{color:var(--mut)}
  .epgp{height:.35rem;border-radius:1rem;background:rgba(255,255,255,.12);overflow:hidden}
  .epgp i{display:block;height:100%;background:var(--grad)}
  .osd .lg{width:8rem;height:4.5rem;background:rgba(255,255,255,.08)}
  .osd .num{color:var(--accent);font-weight:900;font-size:1.4rem}
  .osd h2{margin:0;font-size:3rem;line-height:1}
  .osd p{margin:.3rem 0 0;color:#CFD6E4;font-size:1.15rem}
  .hint{position:absolute;top:1.6rem;left:50%;transform:translateX(-50%);background:rgba(0,0,0,.6);padding:.6rem 1.2rem;border-radius:2rem;font-weight:700;color:#DDE3EE;opacity:0;transition:opacity .3s;pointer-events:none;white-space:nowrap}
  .hint.show{opacity:1}
  .pv-top{position:absolute;top:1.4rem;right:1.4rem;display:flex;gap:.6rem;opacity:0;transition:opacity .2s}
  body:not(.kbd) #pv.full:hover .pv-top,#pv.full .pv-top:focus-within{opacity:1}
  #pv:not(.full) .osd,#pv:not(.full) .pv-top,#pv:not(.full) .hint,#pv:not(.full) .panel{display:none}
  .panel{position:absolute;top:0;bottom:0;left:0;width:34rem;max-width:90vw;background:rgba(7,10,18,.95);padding:2rem 1.2rem 1.2rem;display:flex;flex-direction:column;gap:1rem}
  .panel h3{margin:0 .6rem;font-size:2rem}
  .plist{overflow-y:auto;display:flex;flex-direction:column;gap:.3rem;padding:.2rem}
  .plist::-webkit-scrollbar{width:0}
  .panel.wcats{width:58rem;max-width:96vw}
  .pcols{display:flex;gap:1rem;flex:1;min-height:0}
  .pcols>.plist{flex:1;min-width:0}
  .pcats{flex:0 0 19rem !important;border-right:1px solid rgba(255,255,255,.08);padding-right:.6rem}
  .pcats[hidden]{display:none}
  .pcats .gbtn span{overflow:hidden;text-overflow:ellipsis;white-space:nowrap}

  /* ---------- Ficha ---------- */
  .layer{position:fixed;top:0;right:0;bottom:0;left:0;z-index:40;background:var(--bg);overflow-y:auto;overflow-x:hidden}
  .layer.gridl{z-index:38}
  .gridh{position:sticky;top:0;z-index:2;display:flex;align-items:center;gap:1.2rem;padding:1.4rem 3rem;background:linear-gradient(180deg,var(--bg) 70%,rgba(7,6,14,0))}
  .gridh h2{margin:0;font-size:2rem;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
  .gridh small{color:var(--mut);font-weight:600}
  .gridv{display:grid;grid-template-columns:repeat(auto-fill,minmax(11.5rem,1fr));gap:1.6rem 1.1rem;padding:.6rem 3rem 4rem}
  .gridv .card{width:auto}
  .gridend{grid-column:1/-1;text-align:center;color:var(--mut);padding:1rem}
  .card.more .pi{display:grid;place-items:center;background:linear-gradient(160deg,#1d1640,#100c22);border:1px dashed rgba(163,59,255,.55)}
  .card.more .pi b{font-size:1.25rem;text-align:center;line-height:1.4;padding:0 .8rem}
  body.phone .gridh{padding:calc(.8rem + env(safe-area-inset-top,0px)) 1rem .8rem}
  body.phone .gridh h2{font-size:1.4rem}
  body.phone .gridv{grid-template-columns:repeat(auto-fill,minmax(7.4rem,1fr));gap:1rem .6rem;padding:.4rem 1rem calc(5rem + env(safe-area-inset-bottom,0px))}
  .layer::-webkit-scrollbar{width:0}
  .det-bg{position:absolute;top:0;left:0;right:0;height:88vh;background:#0B0F1A center 20%/cover no-repeat}
  .det-bg::after{content:'';position:absolute;top:0;right:0;bottom:0;left:0;background:linear-gradient(90deg,var(--bg) 0%,rgba(6,8,15,.9) 32%,rgba(6,8,15,.3) 70%,rgba(6,8,15,.15)),linear-gradient(0deg,var(--bg) 0%,transparent 50%)}
  .det-in{position:relative;padding:16vh 4rem 2rem;max-width:58rem;display:flex;flex-direction:column;gap:1.1rem}
  .det-in h1{margin:0;font-size:4.8rem;line-height:.92}
  .det-logo{max-width:28rem;max-height:9rem;object-fit:contain;object-position:left}
  .meta{display:flex;gap:.7rem;flex-wrap:wrap;align-items:center;font-size:1.1rem;color:#CFD6E4;font-weight:600}
  .meta .r{color:var(--accent);font-weight:800}
  .tag{padding:.25rem .7rem;border-radius:.4rem;background:rgba(255,255,255,.1);font-size:.95rem}
  .det-in p{margin:0;font-size:1.25rem;line-height:1.55;color:#DCE2EC}
  .det-in .cast{font-size:1.05rem;color:var(--mut)}
  .det-rows{position:relative;display:flex;flex-direction:column;gap:1.6rem;padding-bottom:3rem}
  .ep .pi{aspect-ratio:16/9}
  .ep{width:18rem}
  .ep .ct{white-space:normal;display:-webkit-box;-webkit-line-clamp:2;-webkit-box-orient:vertical}

  /* ---------- Ventanas ---------- */
  .hdot{display:inline-block;width:.8rem;height:.8rem;border-radius:50%;margin-right:.5rem;flex:none;background:#6b7280;vertical-align:middle}
  .hdot.ok{background:#3ecf6e}.hdot.warn{background:#f5b84b}.hdot.bad{background:#ff5a4e}
  .diag{display:flex;flex-direction:column;gap:.45rem;margin-top:.8rem;max-height:60vh;overflow:auto}
  .diag h3{margin:.8rem 0 .2rem;font-size:1.1rem;color:var(--mut)}
  .drow{display:flex;align-items:center;gap:.6rem;font-size:1.05rem}
  .drow b{min-width:9rem}
  .drow span:last-child{color:var(--mut)}
  .derr{margin:0;font-size:.95rem;color:#ffb4ab;font-family:monospace}
  .dline{display:flex;align-items:center}
  .blogo{display:block;width:100%;max-width:12rem;aspect-ratio:1448/880;min-height:5.5rem;background:center/contain no-repeat;margin:0 auto;filter:drop-shadow(0 0 .8rem rgba(163,59,255,.35))}
  #gate .key.gok{background:#fff;color:#5B12B0;font-size:1.3rem}
  #gate .key.gok:focus{background:var(--grad);color:#fff}
  .glogo{width:70vw;max-width:26rem;height:auto;filter:drop-shadow(0 0 1.6rem rgba(163,59,255,.45))}
  .optp{display:flex;flex-direction:column;gap:.7rem}
  .optp .chips{flex-wrap:wrap}
  .optl{display:flex;flex-direction:column;gap:.5rem;max-height:52vh;overflow:auto}
  #gate{position:fixed;top:0;right:0;bottom:0;left:0;z-index:80;background:radial-gradient(ellipse at 50% 30%,#2a0f4d,#07060E 68%);display:grid;place-items:center;padding:2rem}
  #gate .gbox{width:92vw;max-width:46rem;text-align:center;display:flex;flex-direction:column;gap:1.2rem;align-items:center}
  #gate .logo{width:5rem;height:5rem;font-size:2.2rem;border-radius:1.4rem}
  #gate h1{margin:0;font-size:2.8rem}
  #gate .gcode{font-size:2.6rem;letter-spacing:.3rem;white-space:pre;font-weight:800;min-height:4.4rem;min-width:22rem;padding:.6rem 1.4rem;border-radius:1rem;background:rgba(255,255,255,.07);border:2px solid rgba(255,255,255,.12)}
  #gate .gpad{display:grid;grid-template-columns:repeat(3,6.4rem);gap:.7rem}
  #gate .gpad .key{height:4.6rem;font-size:1.9rem}
  #gate .gst{min-height:1.6rem;color:var(--mut)}
  #gate .gst.bad{color:#ff8a7a}
  #pick{position:fixed;top:0;right:0;bottom:0;left:0;z-index:60;background:rgba(2,4,9,.78);display:grid;place-items:center;padding:2rem}
  .sheet{background:#0E1322;border:1px solid var(--line);border-radius:1.3rem;padding:2.2rem;width:94vw;max-width:50rem;max-height:88vh;overflow-y:auto;display:flex;flex-direction:column;gap:1.2rem}
  .sheet::-webkit-scrollbar{width:0}
  .sheet h2{margin:0;font-size:2.6rem}
  .opt{all:unset;cursor:pointer;display:flex;justify-content:space-between;align-items:center;gap:1rem;padding:1rem 1.2rem;border-radius:.8rem;background:var(--card);font-weight:700;font-size:1.1rem}
  .opt small{display:block;color:var(--mut);font-weight:600;font-size:.9rem;margin-top:.2rem}
  .opt:focus,body:not(.kbd) .opt:hover{background:var(--grad);color:#fff}.opt:focus small{color:#EBDDFF}
  .pin-dots{display:flex;gap:1rem;justify-content:center;font-size:2.4rem;letter-spacing:.3rem;min-height:3rem}
  .pad{display:grid;grid-template-columns:repeat(3,5.5rem);gap:.8rem;justify-content:center}
  .key{all:unset;cursor:pointer;height:4rem;border-radius:.8rem;background:var(--card);display:grid;place-items:center;font-weight:800;font-size:1.4rem}
  .key:focus,body:not(.kbd) .key:hover{background:var(--grad);color:#fff}
  .kb{display:grid;grid-template-columns:repeat(10,minmax(0,3.6rem));gap:.45rem}
  .kb .key{height:3.3rem;font-size:1.15rem}
  .kb .key.w2{grid-column:span 2}.kb .key.w3{grid-column:span 3}

  /* ---------- Buscar ---------- */
  .search{display:flex;gap:2.4rem;padding:0 3rem;flex-wrap:wrap;align-items:flex-start}
  .search .left{display:flex;flex-direction:column;gap:1rem}
  .qbox{font-size:2rem;font-weight:800;min-height:3.6rem;border-bottom:3px solid var(--accent);padding:.3rem .2rem;max-width:37rem;display:flex;align-items:center;gap:.6rem}
  .qbox .ph2{color:#4D5874}
  .caret{width:.15rem;height:2rem;background:var(--grad);animation:bl 1s steps(1) infinite}
  @keyframes bl{50%{opacity:0}}
  .search .right{flex:1 1 30rem;min-width:0;display:flex;flex-direction:column;gap:1rem}
  .search.closed .left{flex-direction:row;align-items:center}
  .search.closed{flex-direction:column;gap:1rem}
  .qbox[role=button]{cursor:pointer;border-radius:.6rem;padding:.3rem .8rem}
  .qbox[role=button]:focus{outline:.22rem solid var(--accent)}
  .kb .key.go{background:var(--grad);color:#fff}

  /* ---------- Servidores y ajustes ---------- */
  .wrap{padding:0 3rem;display:flex;flex-direction:column;gap:1.6rem;max-width:90rem}
  .box{background:var(--card);border:1px solid var(--line);border-radius:1.1rem;padding:1.6rem;display:flex;flex-direction:column;gap:1rem}
  .box h2{margin:0;font-size:2rem}
  .scards{display:grid;grid-template-columns:repeat(auto-fill,minmax(24rem,1fr));gap:1rem}
  .scard{background:#0E1322;border:1px solid var(--line);border-radius:1rem;padding:1.2rem;display:flex;flex-direction:column;gap:.7rem}
  .scard h4{margin:0;font-size:1.3rem;display:flex;gap:.7rem;align-items:center;flex-wrap:wrap}
  .pill{font-size:.75rem;font-weight:800;letter-spacing:.06em;padding:.25rem .6rem;border-radius:.4rem;background:rgba(255,255,255,.08);color:var(--mut);text-transform:uppercase}
  .pill.ok{background:rgba(110,231,160,.14);color:var(--ok)}.pill.warn{background:rgba(245,184,75,.15);color:#F5B84B}.pill.bad{background:rgba(255,138,122,.14);color:var(--bad)}
  .form2{display:grid;grid-template-columns:repeat(auto-fit,minmax(18rem,1fr));gap:1rem;align-items:end}
  .lock{display:flex;flex-direction:column;align-items:center;gap:1.2rem;padding:5rem 2rem;text-align:center}
  .lock svg{width:4rem;height:4rem;color:var(--accent)}

  #toast{position:fixed;left:50%;bottom:2.4rem;transform:translate(-50%,1rem);background:#fff;color:#111;font-weight:700;font-size:1.1rem;padding:1rem 1.6rem;border-radius:.9rem;max-width:90vw;text-align:center;opacity:0;transition:all .25s;z-index:70;pointer-events:none;box-shadow:0 1rem 2rem rgba(0,0,0,.5)}
  #toast.show{opacity:1;transform:translate(-50%,0)}

  body.lite *{transition:none!important;animation-duration:0s!important}
  body.lite .spot .bg.fade{opacity:1}
  body.lite .card:focus .pi{box-shadow:0 0 0 .22rem var(--accent)}

  /* ---------- Celular (iPhone / Android en vertical) ---------- */
  body.phone{-webkit-tap-highlight-color:transparent;overscroll-behavior:none}
  body.phone #app{display:block;height:100vh;height:100dvh}
  body.phone main{height:100%;padding-bottom:calc(4.6rem + env(safe-area-inset-bottom,0px))}
  body.phone #rail{position:fixed;left:0;right:0;bottom:0;top:auto;width:auto;height:auto;z-index:20;flex-direction:row;align-items:stretch;padding:.3rem .3rem calc(.3rem + env(safe-area-inset-bottom,0px));gap:0;overflow-x:auto;border-right:0;border-top:1px solid var(--line);background:rgba(9,7,18,.97)}
  body.phone #rail::-webkit-scrollbar{display:none}
  body.phone #rail .rail-sp{display:none}
  body.phone .nav{flex:1 0 4.4rem;flex-direction:column;justify-content:center;gap:.25rem;height:3.9rem;padding:0 .2rem;font-size:.66rem;letter-spacing:.02em;border-radius:.8rem}
  body.phone .nav svg{width:1.5rem;height:1.5rem}
  body.phone .nav.on{background:none;color:#fff}
  body.phone .nav.on svg{color:var(--accent2);filter:drop-shadow(0 0 .4rem rgba(214,31,240,.6))}
  body.phone .nav:focus{background:none}
  body.phone .brand{position:fixed;top:calc(.35rem + env(safe-area-inset-top,0px));left:.6rem;z-index:7;margin:0;height:3rem;width:5.6rem;padding:0}
  body.phone .blogo{max-width:5.6rem;min-height:3rem}
  body.phone .topbar{top:0;right:0;left:0;justify-content:flex-end;padding:calc(.45rem + env(safe-area-inset-top,0px)) .4rem .5rem;gap:.1rem;background:linear-gradient(180deg,rgba(7,6,14,.92) 55%,rgba(7,6,14,0))}
  body.phone .topbar .clock,body.phone .topbar .tnet,body.phone #tbCode{display:none}
  body.phone .tbtn{width:2.6rem;height:2.6rem}
  body.phone .head{padding:calc(4.4rem + env(safe-area-inset-top,0px)) 1rem .8rem}
  body.phone .head h1{font-size:2.4rem}
  body.phone .strip{padding:.6rem 1rem 1rem;gap:.7rem;scroll-padding:0 1rem}
  body.phone .card{width:8.2rem}
  body.phone .row h3{margin-left:1rem;font-size:1.35rem}
  body.phone .wrap{padding:0 1rem}
  body.phone .box{padding:1.2rem}
  body.phone .spot{height:58vh;min-height:20rem}
  body.phone .spot::after{background:linear-gradient(0deg,var(--bg) 4%,rgba(7,6,14,.75) 38%,rgba(7,6,14,.15) 75%)}
  body.phone .spot .in{padding:0 1rem 2.4rem}
  body.phone .spot h1{font-size:2.5rem}
  body.phone .spot p{font-size:1rem;-webkit-line-clamp:2}
  body.phone .rows,body.phone .view .rows{margin-top:.6rem !important;gap:1.2rem}
  body.phone .view.cat.on{display:block;height:auto}
  body.phone .view.cat .rows{overflow:visible;flex:none}
  body.phone .view.cat .spot{height:46vh;min-height:18rem}
  body.phone:not(.kbd) .card:focus .pi{transform:none;box-shadow:none}
  body.phone:not(.kbd) .btn:focus:not(.pri),body.phone:not(.kbd) .chip:focus:not(.on){background:var(--card2);color:var(--tx);box-shadow:none;transform:none}
  body.phone .det-in{padding:calc(32vh + env(safe-area-inset-top,0px)) 1rem 1.2rem}
  body.phone .det-in h1{font-size:2.4rem}
  body.phone .det-logo{max-width:16rem;max-height:6rem}
  body.phone .det .btns .btn{flex:1 1 45%;justify-content:center}
  body.phone .tvl{display:flex;flex-direction:column;height:auto;padding:calc(4rem + env(safe-area-inset-top,0px)) .6rem 1rem;gap:.8rem}
  body.phone .tvmain .slot{flex:none;width:100%;height:auto;padding-top:56.25%}
  body.phone .tvmain .slot>#pv:not(.full){position:absolute;top:0;left:0;width:100%;height:100%}
  body.phone .tvmain .slot>.mutehint{top:.6rem;left:.6rem}
  body.phone .tvname{font-size:1.1rem}
  body.phone .tvbar{flex-wrap:wrap;gap:.2rem}
  body.phone .tvinfo{display:none}
  body.phone .ibtn{height:2.8rem;padding:0 .7rem}
  body.phone .tvside{max-height:none}
  body.phone .tvside .col{max-height:none;overflow:visible}
  body.phone .tvside .arrow{display:none}
  body.phone #pick{place-items:end center;padding:0}
  body.phone .sheet{width:100%;max-width:none;border-radius:1.3rem 1.3rem 0 0;padding:1.3rem 1rem calc(1.3rem + env(safe-area-inset-bottom,0px));max-height:88vh}
  body.phone .panel{width:100vw;max-width:100vw}
  body.phone .panel.wcats{width:100vw}
  body.phone .pcats{flex:0 0 9.5rem !important}
  body.phone .search{padding:0 1rem;gap:1rem}
  body.phone .kb{grid-template-columns:repeat(10,minmax(0,1fr));width:100%}
  body.phone .kb .key{height:2.9rem;font-size:1rem}
  body.phone .qbox{font-size:1.5rem}
  body.phone #gate .gpad{grid-template-columns:repeat(3,5.6rem)}
  body.phone #gate .gcode{min-width:0;font-size:2rem}
  body.phone #gate .key.gok{font-size:1.05rem}
  body.phone .skipi{bottom:5rem;right:1rem}
  body.phone .pv-top{opacity:1;top:calc(.8rem + env(safe-area-inset-top,0px))}
  body.phone #toast{bottom:calc(5.6rem + env(safe-area-inset-bottom,0px))}
  @media (max-width:900px){
    html{font-size:13px}
    .live{grid-template-columns:1fr;height:auto}
    .prev{order:-1}
    .col{max-height:50vh}
    .spot h1{font-size:3rem}.det-in h1{font-size:3.2rem}
  }

  /* ===== Diseño nuevo: color ambiental, barra de vidrio, enfoque suave ===== */
  #amb{position:fixed;top:0;right:0;bottom:0;left:0;pointer-events:none;z-index:0;background-color:rgb(var(--amb,120,50,210));opacity:var(--ambk,.55);-webkit-mask-image:radial-gradient(ellipse 90% 75% at 70% 14%,#000 0%,rgba(0,0,0,.4) 42%,rgba(0,0,0,.12) 62%,transparent 82%);mask-image:radial-gradient(ellipse 90% 75% at 70% 14%,#000 0%,rgba(0,0,0,.4) 42%,rgba(0,0,0,.12) 62%,transparent 82%);transition:background-color .8s ease}
  /* Modo ligero (Fire TV, proyector): mismo diseño, sin máscaras ni capas que repintan toda la pantalla */
  body.lite #amb{-webkit-mask-image:none;mask-image:none;background:radial-gradient(ellipse 80% 70% at 72% 10%,rgba(var(--amb,120,50,210),.5),rgba(var(--amb,120,50,210),.12) 50%,rgba(7,6,14,0) 80%);opacity:1}
  body.lite .spot .bg{-webkit-mask-image:none;mask-image:none}
  body.lite .spot::after{-webkit-mask-image:none;mask-image:none;background:linear-gradient(0deg,var(--bg) 1%,rgba(7,6,14,0) 45%),linear-gradient(90deg,rgba(7,6,14,.94) 0%,rgba(7,6,14,.75) 30%,rgba(7,6,14,0) 65%)}
  body.lite .strip:focus-within .card:not(:focus) .pi{opacity:1}
  body.lite .card:focus .pi{transform:scale(1.06)}
  body.noamb #amb,body.phone #amb{display:none}
  #app{position:relative;z-index:1}
  .spot .bg{background-color:transparent;-webkit-mask-image:linear-gradient(0deg,transparent 0%,rgba(0,0,0,.6) 22%,#000 48%);mask-image:linear-gradient(0deg,transparent 0%,rgba(0,0,0,.6) 22%,#000 48%)}
  .spot::after{background:linear-gradient(90deg,rgba(7,6,14,.94) 0%,rgba(7,6,14,.78) 28%,rgba(7,6,14,.2) 62%,rgba(7,6,14,0));-webkit-mask-image:linear-gradient(0deg,transparent 0%,#000 45%);mask-image:linear-gradient(0deg,transparent 0%,#000 45%)}
  body:not(.phone) #rail{top:.9rem;bottom:.9rem;left:.9rem;border-radius:1.6rem;border:1px solid rgba(255,255,255,.08);background:rgba(16,12,32,.6);-webkit-backdrop-filter:blur(18px);backdrop-filter:blur(18px);box-shadow:0 1.2rem 3rem rgba(0,0,0,.55)}
  body.lite:not(.phone) #rail{background:rgba(14,11,28,.93);-webkit-backdrop-filter:none;backdrop-filter:none}
  body.mini:not(.phone) #rail{box-shadow:0 .6rem 2rem rgba(0,0,0,.35)}
  body:not(.phone) main{margin-left:6.9rem}
  body:not(.phone) .nav.on{background:rgba(163,59,255,.24);box-shadow:inset 0 0 0 1px rgba(214,31,240,.5),0 0 1.4rem rgba(163,59,255,.45);color:#fff}
  body:not(.phone) .nav:focus{background:var(--grad);color:#fff;box-shadow:0 0 1.6rem rgba(163,59,255,.6)}
  body:not(.phone) .card:focus .pi,body:not(.kbd):not(.phone) .card:hover .pi{transform:scale(1.08);box-shadow:0 0 0 .2rem rgba(255,255,255,.92),0 1rem 2.6rem rgba(var(--amb,120,50,210),.6),0 .8rem 2rem rgba(0,0,0,.5)}
  body.lite .card:focus .pi{box-shadow:0 0 0 .22rem #fff}
  body:not(.phone) .strip:focus-within .card:not(:focus) .pi{opacity:.62}
  .card .pi{transition:transform .18s ease,box-shadow .18s ease,opacity .25s ease}
  .btn{border-radius:2rem}
  .btn:not(.pri){background:rgba(255,255,255,.1);box-shadow:inset 0 0 0 1px rgba(255,255,255,.16)}
  /* Donde estás parado: siempre morado con aro blanco (ajustes, ventanas, menús), distinto de lo elegido (blanco) */
  .btn:focus,.btn.pri:focus,.chip:focus,.chip.on:focus,.opt:focus,.ibtn:focus,.gbtn:focus,.key:focus,.tbtn:focus,.more:focus,body:not(.kbd) .btn.pri:hover{background:var(--grad);color:#fff;border-color:transparent;box-shadow:0 0 0 .18rem #fff,0 0 1.4rem rgba(163,59,255,.55)}
  body.lite .btn:focus,body.lite .chip:focus,body.lite .opt:focus,body.lite .ibtn:focus,body.lite .gbtn:focus,body.lite .key:focus,body.lite .tbtn:focus,body.lite .more:focus{box-shadow:0 0 0 .18rem #fff}
  .opt:focus small,.chip:focus small{color:#F3E8FF}
  .spot p{color:#CFC8E6}

  /* Rendimiento: las filas fuera de pantalla no se dibujan */
  .rows > .row{content-visibility:auto;contain-intrinsic-size:auto 22rem}
  body.phone .rows > .row{contain-intrinsic-size:auto 17rem}
</style>
</head>

            <span class="tvinfo" id="tvInfo"></span>
          </div>
          <div class="pinfo" id="pinfo" hidden></div>
        </div>
        <div class="tvside">
          <div class="arrow">▲</div>
          <div class="col" id="clist"></div>
          <div class="arrow">▼</div>
        </div>
      </div>
    </section>
    <section class="view" id="v-peliculas"></section>
    <section class="view" id="v-series"></section>
    <section class="view" id="v-anime"></section>
    <section class="view" id="v-servidores"></section>
    <section class="view" id="v-ajustes"></section>
